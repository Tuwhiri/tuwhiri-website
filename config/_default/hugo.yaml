# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://tuwhiri.netlify.app/'

############################
## LANGUAGE
############################

# All dates on the site are interpreted in this zone. Without it Hugo uses UTC,
# so a post dated "14 March" can appear a day early to New Zealand readers, and
# scheduled posts publish twelve or thirteen hours late.
timeZone: Pacific/Auckland

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  # `quality` and `hint` moved under the individual formats in Hugo 0.163.
  # The old top-level keys still work but warn on every build.
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  # Hugo 0.165.0 removed `tailwindcss` from the default security.exec.allow
  # list, so from that version the build fails with:
  #   TAILWINDCSS: ... access denied: "tailwindcss" is not whitelisted in
  #   policy "security.exec.allow"
  # Naming the key replaces the default list rather than adding to it, so the
  # rest of the defaults are repeated here.
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^npx$
      - ^postcss$
      - ^tailwindcss$
sitemap:
  _merge: deep
