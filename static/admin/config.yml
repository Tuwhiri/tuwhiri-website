# =============================================================================
# CONTENT EDITOR CONFIGURATION
# =============================================================================
# Controls what appears in the web editor at https://o4o.netlify.app/admin/
#
# ACTION REQUIRED: change `repo:` below to your real GitHub repository,
# written as owner/repository-name.
#
# Note `branch: draft`. Everything saved in the web editor goes to the DRAFT
# site. Nothing anyone types here can change the live site directly.
# =============================================================================

backend:
  name: github
  repo: YOUR-GITHUB-ORG/tuwhiri-website   # <-- CHANGE THIS
  branch: draft
  squash_merges: true

media_folder: 'assets/media'
public_folder: '/media'

collections:

  # ---------------------------------------------------------------- News ----
  - name: news
    label: News
    label_singular: News item
    folder: 'content/post'
    path: '{{year}}-{{month}}-{{day}}-{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{slug}}'
    fields:
      - { label: 'Headline', name: 'title', widget: 'string' }
      - { label: 'One-line summary', name: 'summary', widget: 'text', required: false }
      - { label: 'Date', name: 'date', widget: 'datetime' }
      - label: 'Authors'
        name: 'authors'
        widget: 'relation'
        collection: 'people'
        search_fields: ['title']
        value_field: '{{slug}}'
        display_fields: ['title']
        multiple: true
        required: false
      - label: 'Research area'
        name: 'tags'
        widget: 'select'
        multiple: true
        required: false
        options:
          - { label: 'Atmospheric Science', value: 'atmospheric-science' }
          - { label: 'Photonics', value: 'photonics' }
          - { label: 'Space Systems Engineering', value: 'engineering' }
          - { label: 'Outreach', value: 'outreach' }
          - { label: 'Programme', value: 'programme' }
      - { label: 'Show on the homepage', name: 'featured', widget: 'boolean', default: false }
      - label: 'Picture (name it featured.jpg)'
        name: 'featured_image'
        widget: 'image'
        required: false
        media_library: { config: { multiple: false } }
      - { label: 'Article', name: 'body', widget: 'markdown' }

  # -------------------------------------------------------------- People ----
  - name: people
    label: People
    label_singular: Person
    folder: 'content/authors'
    path: '{{slug}}/_index'
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - { label: 'Full name', name: 'title', widget: 'string' }
      - { label: 'First name', name: 'first_name', widget: 'string', required: false }
      - { label: 'Surname (used for sorting)', name: 'last_name', widget: 'string', required: false }
      - { label: 'Role or position', name: 'role', widget: 'string', required: false }
      - label: 'Institution'
        name: 'organizations'
        widget: 'list'
        required: false
        fields:
          - { label: 'Name', name: 'name', widget: 'string' }
          - { label: 'Website', name: 'url', widget: 'string', required: false }
      - label: 'Photo (name it avatar.jpg)'
        name: 'avatar_filename'
        widget: 'image'
        required: false
        default: 'avatar'
        media_library: { config: { multiple: false } }
      - { label: 'One-line description', name: 'bio', widget: 'string', required: false }
      - label: 'Links (ORCID, email, website)'
        name: 'social'
        widget: 'list'
        required: false
        fields:
          - { label: 'Address', name: 'link', widget: 'string' }
          - label: 'Icon set'
            name: 'icon_pack'
            widget: 'select'
            options: ['fas', 'fab', 'ai']
          - { label: 'Icon name', name: 'icon', widget: 'string' }
      - label: 'Appears under these headings'
        name: 'user_groups'
        widget: 'select'
        multiple: true
        options:
          - 'Programme Leadership'
          - 'Atmospheric Science'
          - 'Photonics'
          - 'Space Systems Engineering'
          - 'Engagement & Outreach'
          - 'Advisory Board'
          - 'Students'
          - 'Alumni'
      - { label: 'Biography', name: 'body', widget: 'markdown', required: false }

  # -------------------------------------------------------------- Events ----
  - name: events
    label: Events
    label_singular: Event
    folder: 'content/event'
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Short description', name: 'abstract', widget: 'text', required: false }
      - { label: 'Starts', name: 'date', widget: 'datetime' }
      - { label: 'Ends', name: 'date_end', widget: 'datetime', required: false }
      - { label: 'Location', name: 'location', widget: 'string', required: false }
      - { label: 'Details', name: 'body', widget: 'markdown', required: false }
