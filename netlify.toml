# =============================================================================
# NETLIFY BUILD SETTINGS
# =============================================================================
# Three kinds of build, as before:
#   production      = `main` branch  -> https://tuwhiri.ac.nz  (public)
#                     (also reachable at tuwhiri.netlify.app, which redirects)
#   branch-deploy   = `draft` branch -> https://draft--tuwhiri.netlify.app
#   deploy-preview  = one temporary site per pull request
#
# WHAT CHANGED WITH THE NEW THEME
# The previous theme was pure Hugo: Netlify downloaded one binary and ran it.
# This theme also needs Node.js, because its styling (Tailwind) and interactive
# parts (Preact) are compiled during the build. That is why every command below
# begins with `pnpm install`, and why HUGO_VERSION and NODE_VERSION both matter.
#
# HUGO_VERSION must be at least 0.161.1. Older versions fail with confusing
# messages about jsx or template functions rather than saying the version is
# too old.
#
# `pagefind` builds the search index after Hugo has produced the pages.
# =============================================================================

[build]
  publish = "public"
  command = """
    set -e
    pnpm install --no-frozen-lockfile
    hugo --gc --minify -b $URL
    pnpm run pagefind
  """

[build.environment]
  HUGO_VERSION = "0.166.0"
  NODE_VERSION = "22"
  GO_VERSION = "1.24.0"
  HUGO_ENABLEGITINFO = "true"
  PNPM_FLAGS = "--no-frozen-lockfile"

[context.production.environment]
  HUGO_ENV = "production"

# The draft site and the pull request previews tell search engines not to index
# them, so unfinished pages never appear in Google.
[context.branch-deploy]
  command = """
    set -e
    pnpm install --no-frozen-lockfile
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL
    pnpm run pagefind
    printf "User-agent: *\nDisallow: /\n" > public/robots.txt
  """

[context.deploy-preview]
  command = """
    set -e
    pnpm install --no-frozen-lockfile
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL
    pnpm run pagefind
    printf "User-agent: *\nDisallow: /\n" > public/robots.txt
  """

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true


# =============================================================================
# CANONICAL DOMAIN
# =============================================================================
# The public address is https://tuwhiri.ac.nz. Netlify also serves every site
# at its own *.netlify.app address, which would leave two copies of the site
# for search engines to find and for people to bookmark.
#
# This sends the old address to the new one, keeping the path, with a
# permanent (301) redirect -- so links shared before the move still land on
# the right page.
#
# It matches ONLY the exact host tuwhiri.netlify.app. The draft site at
# draft--tuwhiri.netlify.app and the per-PR deploy previews have different
# hostnames and are not affected.
#
# ORDER MATTERS: tuwhiri.ac.nz must already be attached to THIS Netlify site
# before this reaches `main`. Deployed earlier, it would send visitors to
# whatever else is answering on tuwhiri.ac.nz at the time.
[[redirects]]
  from = "https://tuwhiri.netlify.app/*"
  to = "https://tuwhiri.ac.nz/:splat"
  status = 301
  force = true

