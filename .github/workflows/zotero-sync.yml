# =============================================================================
# AUTOMATIC PUBLICATION UPDATES FROM ZOTERO
# =============================================================================
# Runs every Monday morning (NZ time) and whenever you press "Run workflow"
# on the Actions tab. It reads the Tuwhiri Zotero group library and updates
# the publication pages on the `draft` branch.
#
# It never touches `main`. New papers appear on the draft site first, and
# reach the live site only when someone promotes draft -> main.
#
# TWO DIFFERENT BRANCHES ARE INVOLVED, WHICH CATCHES EVERYONE OUT ONCE:
#
#   1. The branch you pick in the "Run workflow" box decides which copy of THIS
#      FILE gets run. Edit this file on `main` but launch from `draft`, and the
#      old copy on `draft` is what actually runs.
#   2. The `target_branch` input decides which branch gets the publication
#      pages. It defaults to `draft`.
#
# So if you are testing on a branch such as `theme-v2`, set target_branch to
# `theme-v2`, or the results will land on `draft` and you will not see them.
#
# MAINTENANCE NOTE: the `uses: actions/...@v7` lines name building blocks
# maintained by GitHub. Every year or two GitHub retires the version of Node.js
# an older one was built against and the log shows a deprecation warning. The
# job keeps working; the fix is to raise the number after the @ sign. Current
# versions: https://github.com/actions/checkout and
# https://github.com/actions/setup-python
# =============================================================================

name: Sync publications from Zotero

on:
  schedule:
    - cron: '0 19 * * 0'   # Sunday 19:00 UTC = Monday morning in New Zealand
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Which branch to update (draft is normal)'
        required: true
        default: 'draft'
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:

      # -- 1. Get the files -------------------------------------------------
      # The branch this job READS FROM and WRITES TO. It is not necessarily the
      # branch you picked when starting the job -- that one only decides which
      # copy of this file gets run. Scheduled runs always use `draft`.
      - name: Say which branch is being updated
        run: echo "This run will update the '${{ inputs.target_branch || 'draft' }}' branch."

      - name: Check out the branch to update
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_branch || 'draft' }}

      # -- 2. Confirm the files we need are actually present -----------------
      # If the upload to GitHub missed a folder, this says so plainly instead
      # of failing later with a confusing message.
      - name: Check that the required files exist
        run: |
          missing=0
          for f in scripts/zotero_sync.py data/team.yaml; do
            if [ -f "$f" ]; then
              echo "found    $f"
            else
              echo "MISSING  $f"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo ""
            echo "One or more required files are not in the draft branch."
            echo "Re-upload them, then run this workflow again."
            exit 1
          fi

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install the one library the script needs
        run: pip install pyyaml

      # -- 3. Test the Zotero connection on its own --------------------------
      # Separating this from the sync means a permissions problem shows up
      # here, with a clear explanation, rather than as a generic failure.
      - name: Test the connection to Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: |
          URL="https://api.zotero.org/groups/6627926/items/top?format=json&limit=1"
          if [ -n "$ZOTERO_API_KEY" ]; then
            echo "Using the ZOTERO_API_KEY secret."
            CODE=$(curl -s -o /tmp/z.json -w '%{http_code}' -H "Zotero-API-Version: 3" -H "Zotero-API-Key: $ZOTERO_API_KEY" "$URL")
          else
            echo "No ZOTERO_API_KEY secret is set. Trying anonymous access."
            CODE=$(curl -s -o /tmp/z.json -w '%{http_code}' -H "Zotero-API-Version: 3" "$URL")
          fi
          echo "Zotero replied with HTTP $CODE"
          case "$CODE" in
            200)
              echo "Connection is fine."
              ;;
            403)
              echo ""
              echo "403 means Zotero refused to show the library."
              echo "Either set the group's Library Reading to 'Anyone' at"
              echo "  https://www.zotero.org/groups/6627926/settings/library"
              echo "or create a read-only key at https://www.zotero.org/settings/keys"
              echo "and save it as a repository secret named ZOTERO_API_KEY."
              exit 1
              ;;
            404)
              echo ""
              echo "404 means the group id in the URL is wrong. Check it is 6627926."
              exit 1
              ;;
            *)
              echo ""
              echo "Unexpected reply. First part of the response:"
              head -c 400 /tmp/z.json
              exit 1
              ;;
          esac

      # -- 4. Do the actual work ---------------------------------------------
      - name: Fetch from Zotero and rebuild the publication pages
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
        run: python3 scripts/zotero_sync.py

      # -- 5. Save any changes back to the draft branch ----------------------
      - name: Commit any changes
        run: |
          mkdir -p content/publications
          git config user.name  "tuwhiri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/publications
          if git diff --staged --quiet; then
            echo "Nothing changed. The website already matches Zotero."
          else
            git commit -m "Update publications from Zotero"
            git push
            echo "Changes pushed to the '${{ inputs.target_branch || 'draft' }}' branch."
            echo "Look there, not on main, for the new publication pages."
          fi
