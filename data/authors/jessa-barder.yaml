bio: Leading the community engagement programme, Jessa brings seven years of science
  engagement experience across a wide variety of subject matter to the team. Currently
  based in the University of Otago’s Physics Department, she is also the Deputy Director
  – Community Engagement for Te Whai Ao – Dodd-Walls Centre and supports the department’s
  engagement activities. Despite the “children’s presenter” energy she often manifests,
  her particular area of research interest is the impact of relevant, appropriate,
  and interactive engagement activities on Kiwis over 65.
