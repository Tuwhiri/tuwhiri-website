bio: Carla Meledandri brings the perspective of both a researcher and a programme
  leader to Tuwhiri. A physical chemist and nanoscientist, she spent 13 years in the
  Department of Chemistry at the University of Otago, where she progressed to Associate
  Professor, and was an Investigator in the MacDiarmid Institute for Advanced Materials
  and Nanotechnology. Her research in functional nanomaterials fostered collaborations
  across academia and industry, supporting innovation and commercialisation. As Programme
  Manager, Carla is passionate about enabling collaborative, high-impact research
  that addresses complex scientific and societal challenges.
