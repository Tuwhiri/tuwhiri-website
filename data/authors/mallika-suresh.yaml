bio: Mallika Suresh (Mika) is a Research Fellow at the Physics Department of the University
  of Otago and the Photonics Lead of Tuwhiri. For the last 5 years, her research has
  been focused on electro-optic nonlinear mixing of terahertz signals with optical
  modes in whispering gallery mode resonators. Before that, during her PhD, Mika worked
  with femtosecond pulses in gas-filled hollow-core fibres under the supervision of
  Prof. Philip Russell and Dr. Francesco Tani at the Max Planck Institute for the
  Science of Light. Soon after joining Harald’s team, she supervised the setting up
  of a femtosecond laser ablation system at the Physics Department for (among other
  applications) the fabrication of dielectric whispering gallery mode resonators for
  nonlinear optical experiments. She was the Agnes-Blackie Research Fellow of Te Whai
  Ao – Dodd-Walls Centre for Photonic and Quantum Technologies in 2024 – 2026 and
  now is an Associate Investigator in Te Whai Ao. Mika is also leading collaborations
  with international experts in the field of terahertz photonics such as Prof. Withawat
  Withayachumnankul at the University of Adelaide and Prof. Ileana-Cristina Benea-Chelmus
  at École Polytechnique Fédérale de Lausanne as part of the Tuwhiri programme.
