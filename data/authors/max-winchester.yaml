bio: Max Goddard-Winchester is a Research Engineer at the Robinson Research Institute,
  and a part of the Space Systems Engineers of Tuwhiri. With a background in mechanical
  engineering, he has led the mechanical design of several superconducting magnets
  systems and electric propulsion systems, including the design and flight qualification
  of the Hēki payload which successfully operated aboard the International Space Station.
  With this experience, his role is ensuring the structural performance of Tuwhiri's
  experimental payloads.
