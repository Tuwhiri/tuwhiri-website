bio: 'Johanna Tamminen received a PhD in applied mathematics from the University of Helsinki in 2004 and in 2026 she was conferred as honorary doctorate in technology at the LUT University, Finland. She has strong expertise in research coordination and over 30 years of experience in atmospheric remote sensing and mathematical and statistical methods to analyse and characterize satellite data and related uncertainties. Currently she is a Research Professor at the Finnish Meteorological Institute (FMI) and leading the Earth Observation Research Unit of FMI’s Space and Earth Observation Centre.  She has published over 130 peer-reviewed articles. During the years, her scientific interests have widened from remote sensing of ozone to air quality, greenhouse gases, emissions and more generally to climate. She is and has been member of various panels related to satellite remote sensing, European Space Sciences Committee (2024-2027), ESA Advisory Committee on Earth Observation (2018-2022), GCOS /WRCS Atmospheric Observation Panel for Climate (2018 – 2022), and Swedish National Space Agency (SNSA). She is Co-Principal Investigator of Ozone Monitoring Instrument on-board EOS-Aura satellite, Chair of EUMETSAT Atmospheric Composition Satellite Application Facility (AC-SAF) Steering Group, and previous member of ESA Mission Advisory Group on Sentinel 5 Precursor mission (2012-2018) and Anthropogenic CO2 Monitoring Mission (2017-2019). She acted as the vice director of Research council of Finland funded Centre of Excellence in Inverse Modelling and Imaging (2018 – 2025) and co-PI of Flagship on Advanced Mathematics for Sensing, Imaging and Modeling (FAME) since 2023.'
