bio: Simon Arnold is a research strategy and innovation advisor with extensive experience
  in science, engineering, and technology commercialisation. As Managing Director
  of [https://arnold.co.nz](https://arnold.co.nz), he works with research organisations,
  funders, and industry partners on research strategy, roadmapping, and value creation.
  Simon has held leadership positions across New Zealand's research, energy, manufacturing,
  and business sectors, and has played a key role in shaping national energy research
  strategies. His work focuses on turning New Zealand's scientific and engineering
  capabilities into lasting economic and societal impact.
