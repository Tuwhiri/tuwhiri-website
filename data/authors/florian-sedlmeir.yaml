bio: Florian Sedlmeir is a Research Fellow and Marie Skłodowska-Curie Fellow at the
  University of Otago. His research focuses on high-Q whispering-gallery-mode resonators,
  nonlinear optics, and the conversion of microwave and terahertz signals to the optical
  domain. He completed his PhD at Friedrich-Alexander University Erlangen-Nürnberg,
  carrying out his research at the Max Planck Institute for the Science of Light,
  and subsequently worked in both academic research and industry before returning
  to the University of Otago in 2022. His current work explores electro-optic frequency
  conversion for low-noise millimetre-wave and terahertz detection, as well as microwave-to-optical
  interfaces for quantum technologies.
