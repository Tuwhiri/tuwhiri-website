bio: Celine is a Research Engineer in the space team at the Paihau—Robinson Research
  Institute. She has a Masters of Engineering from Victoria University of Wellington
  focusing on control system design for spacecraft using electromagnetic propulsion,
  as well as a Bachelor of Engineering (Hons) in Electronic and Computer System Engineering.
  Celine has previous industry experience in the NZ aerospace start-up scene, in addition
  to being award the NZ Space Scholarship in 2023 where she undertook an internship
  at NASA’s Jet Propulsion Lab in California. At the Robinson Research Institute,
  Celine spends her time developing spaceflight software and avionics, orbital and
  thermal models of spacecraft, and electromagnetic thruster instrumentation.
