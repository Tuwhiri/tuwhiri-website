# =============================================================================
# TUWHIRI TEAM ROSTER  --  the single source of truth for people
# =============================================================================
# This one file drives TWO things:
#   1. The People page  (scripts/make_people.py turns it into author profiles)
#   2. Publication tagging (scripts/zotero_sync.py uses `area` + `match` to tag
#      each paper pulled from Zotero with the right research area)
#
# TO ADD A PERSON: copy a block, fill it in, save. Then either re-run
# scripts/make_people.py, or just hand-create their content/authors/ folder.
#
# FIELDS -- required
#   slug    : folder name, lowercase, no spaces (becomes /authors/<slug>/)
#             Do NOT change a slug once set. Changing it makes the script treat
#             the person as departed: their file is deleted and a new empty one
#             created, and any biography written for them is lost.
#   name    : display name, exactly as it should appear on the site
#   role    : job title / position
#   org     : institution.
#             For members outside New Zealand, append the country -- and for
#             the United States, the state as well:
#               Caltech, California, USA
#               University of Adelaide, Australia
#             New Zealand organisations carry no country, since the whole
#             programme is based here and it would be noise on every entry.
#   groups  : which headings they appear under on the People page.
#             Advisory board members are listed under their board only, not
#             also under the research area team. The area pages show both
#             headings, so they still appear there.
#             Must match the list in content/people/index.md exactly.
#
# FIELDS -- names and publication matching
#   family  : OPTIONAL. The surname on its own, for sorting. Only needed when
#             the surname is not simply "everything after the first word" --
#             i.e. for middle names, initials, and compound surnames.
#               "Harald G. L. Schwefel"      needs  family: Schwefel
#               "Luis Enrique Garcia Munoz"  needs  family: Garcia Munoz
#               "Mallika Suresh"             does not need it.
#   given   : OPTIONAL. Only needed if the first word is not the given name.
#   area    : ONE of  atmospheric-science | photonics | engineering | ''
#             This is what tags their publications. Blank = no auto-tagging.
#   match   : surname spellings used to recognise them in Zotero author lists.
#             Include accented AND unaccented forms. Case-insensitive.
#
# FIELDS -- profile links   (all optional; omit any and no icon appears)
#   Each adds a small icon to the person's profile page and to the author card
#   under any post they are credited on. Three or four sit comfortably there;
#   a dozen would not.
#
#     email        leave blank unless the person has agreed to it being public
#     orcid        ORCID iD, digits and dashes only, not a URL
#     linkedin     LinkedIn profile URL
#     scholar      Google Scholar profile URL
#     researchgate ResearchGate profile URL
#     github       GitHub profile URL
#     website      personal or group website
#
#   A bare address works -- website: www.example.org becomes https://... --
#   but a full URL is clearer. Example of a fully populated entry:
#
#     - slug: jane-smith
#       name: Jane Smith
#       role: Researcher
#       org: University of Otago
#       orcid: 0000-0001-2345-6789
#       linkedin: https://www.linkedin.com/in/janesmith/
#       website: https://janesmith.example.org
#       area: photonics
#       groups: [Photonics]
#       match: [Smith]
#
#   These belong HERE, not in data/authors/<slug>.yaml. That file is generated,
#   and scripts/make_people.py rebuilds its `links:` list from scratch on every
#   run -- so a link added there by hand disappears the next time anyone
#   updates the roster.
#
# BIOGRAPHIES ARE NOT IN THIS FILE
#   They live in data/authors/<slug>.yaml, in the `bio:` field, and are the one
#   thing make_people.py deliberately preserves rather than regenerating. Write
#   them there, or through CONTENT.md / CONTENT.docx, which round-trip them.
#
#   Keep them to about three lines. The author card under posts shows only the
#   first three; the full text stays on the person's own profile page.
#
# =============================================================================

