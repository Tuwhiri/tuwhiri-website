# =============================================================================
# TUWHIRI TEAM ROSTER  --  the single source of truth for people
# =============================================================================
# This one file drives TWO things:
#   1. The People page  (scripts/make_people.py turns it into author profiles)
#   2. Publication tagging (scripts/zotero_sync.py uses `area` + `match` to tag
#      each paper pulled from Zotero with the right research area)
#
# TO ADD A PERSON: copy a block, fill it in, save. Then either re-run
# scripts/make_people.py, or just hand-create their content/authors/ folder.
#
# FIELDS
#   slug    : folder name, lowercase, no spaces (becomes /author/<slug>/)
#   name    : display name, exactly as it should appear on the site
#   role    : job title / position
#   org     : institution
#   orcid   : ORCID iD, digits only with dashes, or leave blank
#   email   : leave blank unless the person has agreed to it being public
#   area    : ONE of  atmospheric-science | photonics | engineering | ''
#             This is what tags their publications. Blank = no auto-tagging.
#   groups  : which headings they appear under on the People page.
#             Must match the list in content/people/index.md exactly.
#   match   : surname spellings used to recognise them in Zotero author lists.
#             Include accented AND unaccented forms. Case-insensitive.
# =============================================================================

